<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List on TypeScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>📝 Todo List</h1>

            <button id="addButton">Добавить</button>
        </div>
        <ul id="todoList"></ul>
    </div>
    <script type="module" src="/dist/core/main.js"></script>
</body>
</html>
